name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilación (php -l)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Validar composer.json
        run: composer validate --strict
      - name: Verificar sintaxis de todos los archivos PHP
        run: |
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Todos los archivos compilan correctamente"
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

  test:
    name: Pruebas unitarias
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist
      - name: Ejecutar PHPUnit
        run: vendor/bin/phpunit --testdox